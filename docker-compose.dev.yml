services:
  coralconsole:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${COMPOSE_PROJECT_NAME:-coralconsole}:dev
    restart: "no"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CORAL_DEV_ALLOWED_ORIGINS: ${CORAL_DEV_ALLOWED_ORIGINS:-}
    command: npm run dev -- --webpack --hostname 127.0.0.1 --port ${CORAL_INTERNAL_PORT:-39000}
    volumes:
      - .:/app
      - coralconsole-dev-node-modules:/app/node_modules
      - coralconsole-dev-next:/app/.next
      - coralconsole-data:/data

  coralconsole-ingress:
    image: ${COMPOSE_PROJECT_NAME:-coralconsole}:dev
    restart: "no"
    volumes:
      - .:/app

volumes:
  coralconsole-dev-node-modules:
  coralconsole-dev-next:
