services:
  coralconsole:
    build:
      context: .
      network: host
    image: ${COMPOSE_PROJECT_NAME:-coralconsole}:local
    pull_policy: never
    init: true
    restart: unless-stopped
    network_mode: host
    labels:
      org.coralconsole.installation: ${COMPOSE_PROJECT_NAME:-coralconsole}
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${CORAL_INTERNAL_PORT:-39000}
      DATABASE_PATH: /data/coralconsole.db
      CORAL_TRUST_PROXY: ${CORAL_TRUST_PROXY:-false}
      CORAL_TRUSTED_INGRESS: "true"
    volumes:
      - coralconsole-data:/data

  coralconsole-ingress:
    image: ${COMPOSE_PROJECT_NAME:-coralconsole}:local
    pull_policy: never
    init: true
    restart: unless-stopped
    network_mode: host
    labels:
      org.coralconsole.installation: ${COMPOSE_PROJECT_NAME:-coralconsole}
    environment:
      CORAL_INGRESS_BIND_ADDRESS: ${CORAL_BIND_ADDRESS:-127.0.0.1}
      CORAL_INGRESS_PORT: ${CORAL_PORT:-3000}
      CORAL_UPSTREAM_HOST: 127.0.0.1
      CORAL_UPSTREAM_PORT: ${CORAL_INTERNAL_PORT:-39000}
    command: ["node", "scripts/trusted-ingress.mjs"]
    depends_on:
      coralconsole:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-ingress-health.mjs"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  coralconsole-data:
    labels:
      org.coralconsole.installation: ${COMPOSE_PROJECT_NAME:-coralconsole}
